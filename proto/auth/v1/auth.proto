syntax = "proto3";

package auth.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";

option go_package = "auth-service/gen/auth/v1;authv1";

service AuthService {
  // Auth
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/api/auth/login"
      body: "*"
    };
  }
  rpc Register(RegisterRequest) returns (RegisterResponse) {
    option (google.api.http) = {
      post: "/api/auth/register"
      body: "*"
    };
  }
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse) {
    option (google.api.http) = {
      post: "/api/auth/refresh"
      body: "*"
    };
  }
  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = {
      post: "/api/auth/logout"
      body: "*"
    };
  }

  // Users
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = {
      get: "/api/admin/users"
    };
  }
  rpc GetUser(GetUserRequest) returns (GetUserResponse) {
    option (google.api.http) = {
      get: "/api/admin/users/{id}"
    };
  }
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {
    option (google.api.http) = {
      post: "/api/admin/users"
      body: "*"
    };
  }
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse) {
    option (google.api.http) = {
      put: "/api/admin/users/{id}"
      body: "*"
    };
  }
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse) {
    option (google.api.http) = {
      delete: "/api/admin/users/{id}"
    };
  }

  // Roles
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse) {
    option (google.api.http) = {
      get: "/api/admin/roles"
    };
  }
  rpc GetRole(GetRoleRequest) returns (GetRoleResponse) {
    option (google.api.http) = {
      get: "/api/admin/roles/{id}"
    };
  }
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse) {
    option (google.api.http) = {
      post: "/api/admin/roles"
      body: "*"
    };
  }
  rpc UpdateRole(UpdateRoleRequest) returns (UpdateRoleResponse) {
    option (google.api.http) = {
      put: "/api/admin/roles/{id}"
      body: "*"
    };
  }
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse) {
    option (google.api.http) = {
      delete: "/api/admin/roles/{id}"
    };
  }

  // Schema — must be last so grpc-gateway prepends them first (highest match priority)
  rpc GetUsersSchema(GetUsersSchemaRequest) returns (GetUsersSchemaResponse) {
    option (google.api.http) = {
      get: "/api/admin/users/schema"
    };
  }
  rpc GetRolesSchema(GetRolesSchemaRequest) returns (GetRolesSchemaResponse) {
    option (google.api.http) = {
      get: "/api/admin/roles/schema"
    };
  }
}

// --- Auth ---

message LoginRequest {
  string email    = 1 [(buf.validate.field).string = {email: true, max_len: 254}];
  string password = 2 [(buf.validate.field).string = {min_len: 1, max_len: 72}];
}

message LoginResponse {
  string       access_token  = 1;
  UserResponse user          = 2;
  string       refresh_token = 3;
}

message RegisterRequest {
  string email      = 1 [(buf.validate.field).string = {email: true, max_len: 254}];
  string password   = 2 [(buf.validate.field).string = {min_len: 8, max_len: 72}];
  string first_name = 3 [(buf.validate.field).string = {min_len: 1, max_len: 100}];
  string last_name  = 4 [(buf.validate.field).string = {min_len: 1, max_len: 100}];
}

message RegisterResponse {
  string       access_token  = 1;
  UserResponse user          = 2;
  string       refresh_token = 3;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token  = 1;
  string refresh_token = 2;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {
  bool success = 1;
}

// --- Users ---

message GetUserRequest {
  uint64 id = 1;
}

message ListUsersRequest {
  int32               page       = 1;
  int32               limit      = 2;
  string              search     = 3;
  map<string, string> filters    = 4;
  string              sort_by    = 5;
  string              sort_order = 6;
}

message ListUsersResponse {
  repeated UserResponse items = 1;
  int64                 total = 2;
}

message CreateUserRequest {
  string email      = 1 [(buf.validate.field).string = {email: true, max_len: 254}];
  string password   = 2 [(buf.validate.field).string = {min_len: 8, max_len: 72}];
  string first_name = 3 [(buf.validate.field).string = {min_len: 1, max_len: 100}];
  string last_name  = 4 [(buf.validate.field).string = {min_len: 1, max_len: 100}];
  uint64 role_id    = 5 [(buf.validate.field).uint64.gt = 0];
  bool   active     = 6;
}

message UpdateUserRequest {
  uint64 id         = 1 [(buf.validate.field).uint64.gt = 0];
  string email      = 2 [(buf.validate.field).string = {email: true, max_len: 254}];
  string first_name = 3 [(buf.validate.field).string = {min_len: 1, max_len: 100}];
  string last_name  = 4 [(buf.validate.field).string = {min_len: 1, max_len: 100}];
  uint64 role_id    = 5 [(buf.validate.field).uint64.gt = 0];
  bool   active     = 6;
  string password   = 7 [(buf.validate.field).cel = {
    id: "password_length",
    message: "password must be between 8 and 72 characters if provided",
    expression: "this == '' || (this.size() >= 8 && this.size() <= 72)"
  }];
}

message DeleteUserRequest {
  uint64 id = 1;
}

message GetUserResponse {
  UserResponse user = 1;
}

message CreateUserResponse {
  UserResponse user = 1;
}

message UpdateUserResponse {
  UserResponse user = 1;
}

message DeleteUserResponse {
  bool success = 1;
}

message UserResponse {
  uint64       id         = 1;
  string       email      = 2;
  string       first_name = 3;
  string       last_name  = 4;
  uint64       role_id    = 5;
  RoleResponse role       = 6;
  bool         active     = 7;
  string       created_at = 8;
  string       updated_at = 9;
}

// --- Roles ---

message GetRoleRequest {
  uint64 id = 1;
}

message ListRolesRequest {
  int32               page       = 1;
  int32               limit      = 2;
  string              search     = 3;
  map<string, string> filters    = 4;
  string              sort_by    = 5;
  string              sort_order = 6;
}

message ListRolesResponse {
  repeated RoleResponse items = 1;
  int64                 total = 2;
}

message CreateRoleRequest {
  string name = 1 [(buf.validate.field).string = {min_len: 1, max_len: 50}];
}

message UpdateRoleRequest {
  uint64 id   = 1 [(buf.validate.field).uint64.gt = 0];
  string name = 2 [(buf.validate.field).string = {min_len: 1, max_len: 50}];
}

message DeleteRoleRequest {
  uint64 id = 1;
}

message GetRoleResponse {
  RoleResponse role = 1;
}

message CreateRoleResponse {
  RoleResponse role = 1;
}

message UpdateRoleResponse {
  RoleResponse role = 1;
}

message DeleteRoleResponse {
  bool success = 1;
}

message RoleResponse {
  uint64 id         = 1;
  string name       = 2;
  string created_at = 3;
  string updated_at = 4;
}

// --- Schema ---

message SchemaSelectOption {
  string value = 1;
  string label = 2;
}

message SchemaField {
  string name         = 1;
  string type         = 2;
  string label        = 3;
  bool   required     = 4;
  bool   readonly     = 5;
  bool   table_hidden = 6;
  bool   edit_hidden  = 7;
  bool   create_hidden = 8;
  repeated SchemaSelectOption options = 9;
}

message GetUsersSchemaRequest {}

// Response fields map directly to AdminSchema in the frontend.
message GetUsersSchemaResponse {
  string name          = 1;
  string display_name  = 2;
  repeated SchemaField fields     = 3;
  repeated string      searchable = 4;
}

message GetRolesSchemaRequest {}

// Response fields map directly to AdminSchema in the frontend.
message GetRolesSchemaResponse {
  string name          = 1;
  string display_name  = 2;
  repeated SchemaField fields     = 3;
  repeated string      searchable = 4;
}
